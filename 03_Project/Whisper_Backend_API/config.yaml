model_name: large-v3

# No language setting: the language is detected per request (large-v3 is
# multilingual), so audio in any language Whisper knows can be sent in.
#
# Word/character alignment needs a wav2vec2 CTC model per language. whisperx
# ships defaults for many languages (English, etc.) but none for Thai, so
# languages that need an explicit model are named here. Verify the repo still
# exists on huggingface.co, or swap in another Thai wav2vec2 CTC checkpoint.
# A language with neither a default nor an entry here is still transcribed,
# just without word-level timing.
align_models:
  th: airesearch/wav2vec2-large-xlsr-53-th

# Aligners baked into the image at build time and loaded at startup. Any other
# language loads on first use (downloading its model if it isn't cached).
warm_align_languages: [th, en]

device: cuda
# int8 keeps large-v3's VRAM footprint to ~1.5-1.7GB; float16 needs ~3GB,
# which doesn't fit this deployment's tight VRAM budget (see min_free_vram_mb
# below) alongside the OS/desktop's own GPU usage.
compute_type: int8
batch_size: 16

# Alignment (wav2vec2) and Ollama summarization run on CPU on purpose: the
# whole card only has a few GB free after OS/desktop overhead, and whisper
# itself is the only model worth spending that on.
align_device: cpu

# Input constraints
allowed_extensions: [".wav", ".mp3", ".m4a", ".flac", ".ogg", ".webm"]
max_file_size_mb: 25
max_duration_sec: 1800

# Concurrency / serving
request_timeout_sec: 600
max_queue_size: 10

# Reject GPU-bound requests (transcribe, diarize) instead of risking a CUDA
# OOM crash if the whole card's free VRAM drops below this. Counts every
# process on the GPU (OS/desktop included), not just this container's own
# usage - see the grilling notes on the 3.5GB total-card budget.
min_free_vram_mb: 300

host: 0.0.0.0
port: 8050

# /summarize talks to a separate Ollama container (see docker-compose.yaml).
# OLLAMA_BASE_URL env var overrides this if set. qwen2.5:3b (not 7b) because
# Ollama runs CPU-only here to stay inside the VRAM budget.
ollama_base_url: http://ollama:11434
ollama_model: qwen2.5:3b

# Mono-file speaker separation in /diarize (stereo files are split by channel
# instead). Uses a public SpeechBrain model, no token needed. 2 = a two-party
# service call (staff + customer); 0 lets the model guess, which over-splits.
diarize_num_speakers: 2
