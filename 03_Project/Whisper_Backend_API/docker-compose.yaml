name: whisper-backend-api

services:
  whisper-api:
    build: .
    image: whisper-backend-api:latest
    ports:
      - "8050:8050"
    restart: unless-stopped
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    networks:
      - default
      - summarize-net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# Ollama is deployed separately from ../Summarize_Model (start it first); this
# joins its network so OLLAMA_BASE_URL=http://ollama:11434 still resolves.
networks:
  summarize-net:
    external: true
    name: summarize-net
