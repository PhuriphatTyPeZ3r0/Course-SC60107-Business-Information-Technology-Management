name: summarize-model

services:
  # CPU-only on purpose: the single GPU's VRAM budget is fully committed to
  # whisper (see Whisper_Backend_API/config.yaml's compute_type/align_device
  # notes) - Ollama gets no GPU reservation here.
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OLLAMA_MODEL: qwen2.5:3b
    image: whisper-backend-ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    networks:
      - summarize-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

# Fixed name so Whisper_Backend_API's compose can join it as an external
# network and keep reaching this service as http://ollama:11434.
networks:
  summarize-net:
    name: summarize-net
